<div class="overflow-x-auto">
  <table class="w-full text-sm">
    <thead>
      <tr class="text-left text-gray-400 border-b border-gray-700">
        <th class="py-3 pr-4">Nome</th>
        <th class="py-3 pr-4">Tipo</th>
        <th class="py-3 pr-4">Status</th>
        <th class="py-3 pr-4">MAC</th>
        <th class="py-3 pr-4">MTU</th>
        <th class="py-3 pr-4">RX</th>
        <th class="py-3 pr-4">TX</th>
        <th class="py-3 pr-4">Erros RX/TX</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let iface of interfaces" class="border-b border-gray-800 hover:bg-gray-700/40 transition">
        <td class="py-3 pr-4 font-mono text-white">{{ iface.name }}</td>
        <td class="py-3 pr-4 text-gray-300">{{ iface.type }}</td>
        <td class="py-3 pr-4">
          <span [class]="iface.running ? 'bg-green-900 text-green-300' : 'bg-red-900 text-red-300'"
            class="px-2 py-0.5 rounded text-xs font-medium">
            {{ iface.running ? 'up' : 'down' }}
          </span>
        </td>
        <td class="py-3 pr-4 font-mono text-gray-300 text-xs">{{ iface.macAddress }}</td>
        <td class="py-3 pr-4 text-gray-300">{{ iface.mtu }}</td>
        <td class="py-3 pr-4 text-gray-300">{{ formatBytes(iface.rxBytes) }}</td>
        <td class="py-3 pr-4 text-gray-300">{{ formatBytes(iface.txBytes) }}</td>
        <td class="py-3 pr-4 text-gray-400 text-xs">{{ iface.rxErrors }} / {{ iface.txErrors }}</td>
      </tr>
    </tbody>
  </table>
  <p *ngIf="interfaces.length === 0" class="text-gray-500 text-sm py-6 text-center">Nenhuma interface encontrada</p>
</div>
