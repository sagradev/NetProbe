<div class="overflow-x-auto">
  <table class="w-full text-sm">
    <thead>
      <tr class="text-left text-gray-400 border-b border-gray-700">
        <th class="py-3 pr-4">Hostname</th>
        <th class="py-3 pr-4">IP</th>
        <th class="py-3 pr-4">MAC</th>
        <th class="py-3 pr-4">Status</th>
        <th class="py-3 pr-4">Expira em</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let l of leases" class="border-b border-gray-800 hover:bg-gray-700/40 transition">
        <td class="py-3 pr-4 text-white">{{ l.hostname || '—' }}</td>
        <td class="py-3 pr-4 font-mono text-gray-300">{{ l.address }}</td>
        <td class="py-3 pr-4 font-mono text-gray-300 text-xs">{{ l.macAddress }}</td>
        <td class="py-3 pr-4">
          <span [class]="statusClass(l.status)" class="px-2 py-0.5 rounded text-xs font-medium">{{ l.status }}</span>
        </td>
        <td class="py-3 pr-4 text-gray-400 text-xs">{{ l.expiresAfter || '—' }}</td>
      </tr>
    </tbody>
  </table>
  <p *ngIf="leases.length === 0" class="text-gray-500 text-sm py-6 text-center">Nenhum lease DHCP encontrado</p>
</div>
